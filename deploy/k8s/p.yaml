# p.x6c.us on the Vultr VKE cluster (x6c1-cluster1). Expects, in the cluster:
#   - rqlite at rqlite.rqlite.svc.cluster.local (opskit),
#   - Traefik as the default IngressClass and cert-manager's `letsencrypt`
#     ClusterIssuer,
#   - two Secrets in namespace p, created by hand (see README.md):
#     `p-rypt` and `ghcr-pull`.
apiVersion: v1
kind: Namespace
metadata:
  name: p
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p
  namespace: p
  labels:
    app.kubernetes.io/name: p
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: p
  template:
    metadata:
      labels:
        app.kubernetes.io/name: p
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: p
          image: ghcr.io/x6c-co/p-x6c-us:v0.1.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: P_BASE_URL
              value: https://p.x6c.us
            - name: P_RQLITE_URL
              value: http://rqlite.rqlite.svc.cluster.local
            - name: P_ID_FORMAT
              value: uuid
            # Traefik overwrites X-Real-Ip with the client address, and the
            # NetworkPolicy below lets only Traefik reach this pod.
            - name: P_TRUST_PROXY
              value: "true"
          envFrom:
            - secretRef:
                name: p-rypt # P_RYPT_KEY_ID, P_RYPT_TOKEN
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: p
  namespace: p
spec:
  selector:
    app.kubernetes.io/name: p
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: p
  namespace: p
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: p
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: p
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: p
  namespace: p
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: p-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [p.x6c.us]
      secretName: p-tls
  rules:
    - host: p.x6c.us
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: p
                port:
                  name: http
